<!DOCTYPE html>
<html lang="ja" data-ls-dark="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ためしの間は検索に出さない。なかまの一覧・ポートフォリオに載せるときに外す -->
<meta name="robots" content="noindex, nofollow">
<title>うみくる｜海のごきげん、くらべて先どり</title>
<meta name="description" content="うみくる（UmiQru）。同じ場所の波・風・潮・天気を、気象庁と世界の予報でくらべる。釣りや海あそびの前の下しらべに。無料・登録なし。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="うみくる（UmiQru）">
<meta property="og:title" content="うみくる｜海のごきげん、くらべて先どり">
<meta property="og:description" content="同じ場所の波・風・潮・天気を、気象庁と世界の予報でくらべる。">
<meta property="og:url" content="https://katsuan.github.io/umiqru/">
<meta property="og:image" content="https://katsuan.github.io/umiqru/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="preconnect" href="https://marine-api.open-meteo.com">
<link rel="stylesheet" href="https://katsuan.github.io/oqrn/shared/ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<body>
<main>
  <header class="ls-brand">
    <h1 class="ls-brand-name"><img class="ls-brand-icon" src="icon.svg" alt="" width="30" height="30">うみくる</h1>
    <img class="ls-brand-logo" src="logo.svg" alt="UmiQru" width="97" height="28">
  </header>
  <p class="ls-brand-copy">海のごきげん、くらべて先どり</p>

  <form class="controls" id="place-form" autocomplete="off">
    <div class="place">
      <label class="vh" for="place-input">場所</label>
      <input type="search" id="place-input" placeholder="港・地名（例：城ヶ島、鴨川）" enterkeyhint="search">
      <button type="submit" class="primary">見る</button>
      <button type="button" id="here" aria-label="今いる場所">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg>
      </button>
    </div>
    <div class="chips" id="recent"></div>
    <div class="chips" id="days" role="group" aria-label="日にち"></div>
  </form>

  <p class="status" id="status" aria-live="polite"></p>
  <div id="alert"></div>

  <section class="card" id="summary"></section>

  <section class="card">
    <h2>天気と降水確率</h2>
    <div id="wx-jma"></div>
    <h3 class="small sub" style="margin:16px 0 0;font-weight:700">1時間ごと（横にスクロール）</h3>
    <div id="wx-tl"></div>
  </section>

  <section class="card">
    <h2>波の高さ</h2>
    <div id="waves"></div>
    <ul class="legend" id="wave-legend"></ul>
    <div class="chart" id="wave-chart"></div>
    <div class="table-wrap"><table id="wave-table"></table></div>
    <h3 class="small sub" style="margin:16px 0 0;font-weight:700">1時間ごと（来る向きと高さ m・横にスクロール）</h3>
    <div id="wave-tl"></div>
  </section>

  <section class="card">
    <div class="sec-head">
      <h2>風の強さ</h2>
      <div class="seg" role="group" aria-label="風の向きの出し方">
        <button type="button" data-dir="16">16方位</button>
        <button type="button" data-dir="deg">角度</button>
      </div>
    </div>
    <ul class="legend" id="wind-legend"></ul>
    <div class="chart" id="wind-chart"></div>
    <div class="table-wrap"><table id="wind-table"></table></div>
    <h3 class="small sub" style="margin:16px 0 0;font-weight:700">1時間ごと（吹いてくる向きと風速 m/s・横にスクロール）</h3>
    <div id="wind-tl"></div>
  </section>

  <section class="card">
    <h2>潮の満ち引き</h2>
    <ul class="legend" id="tide-legend"></ul>
    <div class="chart" id="tide-chart"></div>
    <div class="tides" id="tide-list"></div>
  </section>

  <section class="card">
    <details class="howto" id="howto">
      <summary><span id="howto-title"></span><span class="sub">開く</span></summary>
      <p class="sub small" style="margin:0 0 8px" id="howto-lead"></p>
      <ol class="steps" id="howto-steps"></ol>
      <h3 class="small sub" style="margin:16px 0 0;font-weight:700">Parameter の書き方</h3>
      <div class="table-wrap"><table id="howto-params"></table></div>
      <p class="muted small" style="margin:8px 0 0" id="howto-note"></p>
      <p class="muted small" style="margin:8px 0 0" id="howto-version"></p>
    </details>
  </section>

  <footer id="credits"></footer>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
