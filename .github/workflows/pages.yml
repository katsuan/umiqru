# 公開：main に push したら、そのまま GitHub Pages に出す（ためしの間）。
# Q 共通の公開（katsuan/oqrn の q-pages.yml。テストは非公開の q-dev）に切りかえるときは、secret Q_DEV_KEY を登録してから、この中身を入れかえる
name: 公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: 出すものだけの写し（tools/・README は入れない）
        run: |
          mkdir _site
          cp -R index.html app.js style.css sw.js manifest.webmanifest js data *.png *.svg SQriptableSea.js sea-version.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
